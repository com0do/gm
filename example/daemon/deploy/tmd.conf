; tmd.conf -- configuration of the telemetry daemon (INI, read with libini).

[daemon]
window       = 120   ; samples kept per metric
report_every = 0     ; a snapshot every N samples; 0: once, at the end of the input

[thresholds]
; an alarm is raised when a sample is above the limit, cleared when one is back at or below it
cpu.load      = 0.90
disk.used_pct = 95
temp.celsius  = 80
