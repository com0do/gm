name:        hello2
version:     1.0.0
base:        registry.access.redhat.com/ubi8/ubi-minimal:8.10
registry:    localhost
entrypoint:  /usr/local/bin/hello2.sh

prerequisites:
  - tar

install:
  file: installGuide.in

# Consume a gm-built RPM by staging it into extras[].  This is what
# makes the DAG cross the gm↔container boundary: the container's
# dep.json now references a gm-managed .rpm; a change to any source
# that libtmstats pulls in propagates: summary.cxx -> libtmstats.so ->
# pkg-tmd.rpm -> hello2 image.
extras:
  - src: '../../../build/pkg/rhlinux/debug/pkg-tmd-1.4.0-1.el8.x86_64.rpm'
    dst: pkg-tmd.rpm

extra:
  docker_source_path: ./examples/hello2/
  version_string:     hello2/1.0.0
