name: Upstream RPM update check

# ─────────────────────────────────────────────────────────────────────
# Weekly poll:  for every container image manifest known to the tree,
# ask `container check-rpm-update` whether any of the RPMs it pinned
# have newer versions upstream.
#
# Output goes two places:
#   * text report as job summary (viewable in the GH UI)
#   * if any updates found, either:
#       - open (or update) a tracking issue with a checklist
#       - or, when triggered via `workflow_dispatch`, print to logs
#
# Skips silently on PRs and pushes -- this is a scheduled-only lane.
# ─────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Every Monday 04:23 UTC -- avoids the peak-hour cron rush that
    # GH actions runners see at :00.
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      open_issue:
        description: 'Open/update an issue if updates found'
        type: boolean
        default: false

permissions:
  contents: read
  issues:   write   # for the tracking issue

env:
  BUILD_ARCH: rhlinux
  MAKEFLAGS: -j2 --no-print-directory

jobs:
  check:
    name: check-rpm-update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up gm environment (with docker for optional rpm -qa)
        uses: ./.github/actions/setup-gm-env
        with:
          install-docker: 'true'

      - name: Populate baseline dep.json for every container example
        run: |
          set -euo pipefail
          mkdir -p build/container
          for manifest in container/examples/*/image.yaml; do
            [ -f "$manifest" ] || continue
            echo "== $manifest =="
            python3 container/imageBuild.py --no-rpms deps "$manifest" || {
              echo "  (skipped: deps failed -- likely needs real RPM resolve)"
            }
          done

      - name: Run check-rpm-update (text)
        id: text
        run: |
          set +e
          python3 container/imageBuild.py check-rpm-update \
              --dep-json-dir build/container \
              --format text > /tmp/rpm-update-report.txt
          rc=$?
          echo "found_updates=$([ $rc -eq 0 ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          cat /tmp/rpm-update-report.txt

      - name: Run check-rpm-update (json)
        run: |
          python3 container/imageBuild.py check-rpm-update \
              --dep-json-dir build/container \
              --format json > /tmp/rpm-update-report.json || true
          jq . /tmp/rpm-update-report.json || true

      - name: Render report as job summary
        run: |
          {
            echo '# 🧊 Weekly upstream RPM check'
            echo
            echo '## Text report'
            echo '```'
            cat /tmp/rpm-update-report.txt || echo '(empty)'
            echo '```'
            echo
            echo '## JSON'
            echo '```json'
            cat /tmp/rpm-update-report.json 2>/dev/null | jq . || echo '{}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: rpm-update-report
          path: |
            /tmp/rpm-update-report.txt
            /tmp/rpm-update-report.json
          retention-days: 90

      # Only file / update an issue when updates were found AND we're
      # either on schedule OR the user asked via workflow_dispatch.
      - name: Open / update tracking issue
        if: >-
          steps.text.outputs.found_updates == 'true' &&
          (github.event_name == 'schedule' ||
           github.event.inputs.open_issue == 'true')
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const body = [
              '## Upstream RPM updates available',
              '',
              `Generated by [\`rpm-updates.yml\` run #${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '### Report',
              '```',
              fs.readFileSync('/tmp/rpm-update-report.txt', 'utf8').trim(),
              '```',
              '',
              '_This issue is auto-updated weekly.  Close it once the images have been rebuilt with the pinned versions bumped._',
            ].join('\n');

            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'rpm-updates',
            });
            if (issues.length > 0) {
              const num = issues[0].number;
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: num, body, state: 'open',
              });
              console.log(`Updated #${num}`);
            } else {
              const {data: created} = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'chore(container): upstream RPM updates available',
                body, labels: ['rpm-updates'],
              });
              console.log(`Opened #${created.number}`);
            }
