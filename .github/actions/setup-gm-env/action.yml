name: Set up gm build environment
description: >-
  Install everything gm's Makefile expects on Rocky 9 / Rocky 8 (or
  ubuntu) runner: gcc / g++ / binutils (ar) / make, jq, Python 3.12 +
  PyYAML, ccache, gcovr, lcov, rpmbuild, go (for `example/exporter` and `example/cgo`), and
  shellcheck.  Also provisions ccache with a stable key derived from
  OS + BUILD_MODE so incremental C/C++ builds stay hot across PR
  iterations.

  Runs on both:
    * `container: rockylinux:9` (PR CI / production parity;
      BUILD_ARCH=rhlinux)
    * `container: rockylinux:8` (nightly compat lane)
    * `ubuntu-latest`           (fallback for lint / docs / docker jobs)

  Inputs are all optional -- callers just `uses:` the action and
  the right tools land.

inputs:
  build-mode:
    description: Label for the ccache key (a BUILD_MODE or a CI lane name).
                 Default 'debug'.
    required: false
    default: 'debug'
  install-docker:
    description: Also install docker client + buildx (ubuntu-latest
                 only).  Set to 'true' for container-build jobs.
    required: false
    default: 'false'
  install-coverage:
    description: Install gcovr + lcov + perl bits for `make coverage`.
                 Default 'false' (only coverage job needs them).
    required: false
    default: 'false'
  sanitize:
    description: SANITIZE value the job will build with (address, undefined,
                 thread; comma separated; '' / 'none' = none).  Installs the
                 matching runtime RPMs (libasan / libubsan / libtsan) on the
                 RHEL family -- Ubuntu's gcc already pulls them in.
    required: false
    default: ''
  install-go:
    description: Install golang toolchain for the go examples (example/exporter, example/cgo).  Default
                 'true' since it's cheap.
    required: false
    default: 'true'
  install-java:
    description: Install a JDK (javac + jar + java) for target.java.mk
                 (example/dashboard).  Default 'true' -- the
                 install is cheap, and the C-only lane still needs
                 java for the pipeline run (tmview.jar) in the build job.
    required: false
    default: 'true'

outputs:
  ccache-key:
    description: >-
      Primary actions/cache key for ccache.  Pass to save-gm-cache
      after compile steps in the same job.
    value: ${{ steps.ccache-restore.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    # ────────────────────────────────────────────────────────────
    # Detect OS -- Rocky vs Ubuntu -- so we pick the right pm.
    # ────────────────────────────────────────────────────────────
    - name: Detect OS
      id: os
      shell: bash
      run: |
        if [ -f /etc/rocky-release ] || [ -f /etc/redhat-release ]; then
          echo "family=rhel" >> "$GITHUB_OUTPUT"
          # Cache keys: distinguish Rocky 8 vs 9 (glibc + RPM sets differ).
          . /etc/os-release
          echo "distro=${ID}-${VERSION_ID}" >> "$GITHUB_OUTPUT"
        else
          echo "family=ubuntu" >> "$GITHUB_OUTPUT"
          echo "distro=ubuntu" >> "$GITHUB_OUTPUT"
        fi
        # The dnf cache is renewed weekly: a hit keeps its metadata for 7 days (see below).
        echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

    # actions/cache compresses with zstd when it finds the zstd command, else with gzip, and the
    # compression is part of the cache version.  The Rocky images have no zstd, the toolchain
    # install pulls it in: the dnf cache was looked up without zstd and saved with it, and never
    # matched.  So zstd is installed before the lookup -- from its own small cache of the rpms,
    # saved before they are installed (gzip, like its lookup).  Fetching them from the repos on
    # every run cost a repo's metadata, 40 MB from a mirror that can take minutes.
    - name: Restore the zstd rpms (RHEL family)
      id: zstd-rpms
      if: steps.os.outputs.family == 'rhel'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
      with:
        path: .ci-cache/zstd-rpms
        key: zstd-rpms-${{ steps.os.outputs.distro }}-v1

    - name: Download the zstd rpms (RHEL family, first run)
      if: steps.os.outputs.family == 'rhel' && steps.zstd-rpms.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        # EL9 has zstd in BaseOS, EL8 in AppStream (libzstd in BaseOS).
        dnf install -y -q --downloadonly --downloaddir=.ci-cache/zstd-rpms --setopt=install_weak_deps=False \
            --disablerepo='*' --enablerepo=baseos --enablerepo=appstream zstd
        ls .ci-cache/zstd-rpms

    - name: Save the zstd rpms (RHEL family, first run)
      if: steps.os.outputs.family == 'rhel' && steps.zstd-rpms.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
      with:
        path: .ci-cache/zstd-rpms
        key: zstd-rpms-${{ steps.os.outputs.distro }}-v1

    - name: Install zstd (RHEL family)
      if: steps.os.outputs.family == 'rhel'
      shell: bash
      run: |
        set -euo pipefail
        command -v zstd >/dev/null && exit 0
        dnf install -y -q --disablerepo='*' .ci-cache/zstd-rpms/*.rpm \
          || dnf install -y -q --setopt=install_weak_deps=False \
                 --disablerepo='*' --enablerepo=baseos --enablerepo=appstream zstd
        zstd --version

    # RHEL / Rocky: dnf cache MUST live under GITHUB_WORKSPACE.
    # Container jobs only persist workspace paths through actions/cache;
    # caching /var/cache/dnf directly never saves across runs.
    - name: Restore dnf cache (RHEL family)
      id: dnf-cache
      if: steps.os.outputs.family == 'rhel'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
      with:
        path: .ci-cache/dnf
        key: dnf-${{ steps.os.outputs.distro }}-v7-${{ steps.os.outputs.week }}-${{ inputs.install-coverage }}-${{ inputs.sanitize }}-${{ inputs.install-go }}-${{ inputs.install-java }}-${{ hashFiles('.github/actions/setup-gm-env/action.yml') }}
        restore-keys: |
          dnf-${{ steps.os.outputs.distro }}-v7-${{ steps.os.outputs.week }}-
          dnf-${{ steps.os.outputs.distro }}-v7-

    - name: Install base toolchain (RHEL family)
      if: steps.os.outputs.family == 'rhel'
      shell: bash
      env:
        DNF_CACHE_HIT: ${{ steps.dnf-cache.outputs.cache-hit }}
      run: |
        set -euo pipefail
        cache_root="${GITHUB_WORKSPACE}/.ci-cache/dnf"
        mkdir -p "${cache_root}/cache" "${cache_root}/lib"
        _dnf_opt() {
          local key="$1" val="$2"
          if grep -q "^${key}=" /etc/dnf/dnf.conf; then
            sed -i "s|^${key}=.*|${key}=${val}|" /etc/dnf/dnf.conf
          else
            echo "${key}=${val}" >> /etc/dnf/dnf.conf
          fi
        }
        _dnf_opt cachedir "${cache_root}/cache"
        _dnf_opt persistdir "${cache_root}/lib"
        _dnf_opt keepcache 1
        echo "dnf actions/cache hit: ${DNF_CACHE_HIT:-unknown}"
        meta_expire=21600
        if [ "${DNF_CACHE_HIT:-}" = "true" ]; then
          meta_expire=604800
        fi
        # A mirror caught mid-sync serves a repomd.xml whose primary / filelists are on no mirror
        # yet: every download 404s (EPEL, Oct 2026).  Drop the metadata and fetch it again.
        _dnf_install() {
          local try
          for try in 1 2 3; do
            dnf install -y --setopt=install_weak_deps=False --setopt=keepcache=1 \
                --setopt=metadata_expire="${meta_expire}" "$@" && return 0
            [ "$try" = 3 ] && break
            echo "setup-gm-env: dnf install failed (attempt $try of 3); refetching the repo metadata" >&2
            dnf clean metadata
            sleep $((try * 30))
          done
          return 1
        }
        _dnf_install epel-release
        _dnf_install \
            gcc gcc-c++ make binutils \
            jq git which \
            rpm-build rpmdevtools \
            findutils tar gzip \
            expat python3.12 python3.12-pip \
            ccache ShellCheck
        san_pkgs=""
        for s in $(echo "${{ inputs.sanitize }}" | tr ',' ' '); do
          case "$s" in
            address)   san_pkgs="$san_pkgs libasan" ;;
            undefined) san_pkgs="$san_pkgs libubsan" ;;
            thread)    san_pkgs="$san_pkgs libtsan" ;;
            none|"")   ;;
            *) echo "setup-gm-env: unknown sanitizer '$s'" >&2; exit 1 ;;
          esac
        done
        if [ -n "$san_pkgs" ]; then
          # shellcheck disable=SC2086  # word-split on purpose
          _dnf_install $san_pkgs
        fi
        if [ "${{ inputs.install-go }}" = "true" ]; then
          _dnf_install golang || true
        fi
        if [ "${{ inputs.install-java }}" = "true" ]; then
          _dnf_install java-11-openjdk-devel || true
        fi
        alternatives --install /usr/bin/python3 python3 /usr/bin/python3.12 100
        alternatives --set python3 /usr/bin/python3.12

    - name: Install coverage tools (RHEL family)
      if: steps.os.outputs.family == 'rhel' && inputs.install-coverage == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # Rocky 8: powertools.  Rocky 9: crb (same role, renamed).
        if dnf repolist --all 2>/dev/null | awk '{print $1}' | grep -qx crb; then
          extra_repo=crb
        else
          extra_repo=powertools
        fi
        dnf install -y --enablerepo="${extra_repo}" \
            --setopt=install_weak_deps=False --setopt=keepcache=1 \
            lcov perl-DateTime perl-JSON perl-App-cpanminus || true
        PIP_CACHE_DIR="${GITHUB_WORKSPACE}/.ci-cache/pip" python3 -m pip install gcovr

    # ────────────────────────────────────────────────────────────
    # Ubuntu path (GitHub-hosted runner, no container: the container and integration jobs)
    #
    # No apt cache: the runner image already has the large tools (JDKs, Go), what apt still
    # fetches is a few MB.  (Caching /var/cache/apt/archives never worked: its
    # partial/ and lock are root-only, so the save failed every run.)
    # ────────────────────────────────────────────────────────────
    - name: Set up Python 3.12 (Ubuntu)
      if: steps.os.outputs.family == 'ubuntu'
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: '3.12'

    - name: Install base toolchain (Ubuntu)
      if: steps.os.outputs.family == 'ubuntu'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
            build-essential ccache jq \
            rpm shellcheck git ca-certificates

    - name: Install coverage tools (Ubuntu)
      if: steps.os.outputs.family == 'ubuntu' && inputs.install-coverage == 'true'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get install -y --no-install-recommends lcov
        python3 -m pip install gcovr

    # Go and the JDK come with GitHub's Ubuntu image; apt only on a runner without them.  Their
    # 175 MB of .debs once took the integration job past its 25 minutes on a slow mirror.
    - name: Install Go (Ubuntu)
      if: steps.os.outputs.family == 'ubuntu' && inputs.install-go == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # The image's default Go (1.24) is on PATH.
        if ! command -v go >/dev/null; then
          sudo apt-get install -y --no-install-recommends golang-go
        fi

    - name: Install JDK (Ubuntu)
      if: steps.os.outputs.family == 'ubuntu' && inputs.install-java == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # The image's default JDK (17) is on PATH.
        if ! command -v javac >/dev/null || ! command -v jar >/dev/null; then
          sudo apt-get install -y --no-install-recommends default-jdk-headless
        fi

    - name: Restore pip cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
      with:
        path: .ci-cache/pip
        key: pip-${{ steps.os.outputs.distro }}-py3.12-${{ hashFiles('production/requirements.txt') }}
        restore-keys: |
          pip-${{ steps.os.outputs.distro }}-py3.12-

    - name: Install gm Python runtime deps
      shell: bash
      run: |
        set -euo pipefail
        export PIP_CACHE_DIR="${GITHUB_WORKSPACE}/.ci-cache/pip"
        mkdir -p "$PIP_CACHE_DIR"
        python3 -m pip install \
            'PyYAML>=6.0,<7' 'jsonschema>=4.19,<5'

    # ccache: flags.mk wraps as `ccache /usr/bin/gcc` via CCACHE_PATH env.
    # Do NOT prepend /usr/lib*/ccache to PATH -- the wrappers need the
    # real compiler on PATH and break bare `gcc` calls in CI scripts.
    - name: Prime ccache
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "${GITHUB_WORKSPACE}/.ci-cache/ccache"
        echo "CCACHE_DIR=${GITHUB_WORKSPACE}/.ci-cache/ccache" >> "$GITHUB_ENV"
        if command -v ccache >/dev/null 2>&1; then
          echo "CCACHE_ENABLE=yes" >> "$GITHUB_ENV"
          echo "CCACHE_PATH=$(command -v ccache)" >> "$GITHUB_ENV"
          ccache -M 2G
        fi

    - name: Restore ccache
      id: ccache-restore
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
      with:
        path: .ci-cache/ccache
        # Stable across commits; ccache invalidates per translation unit
        # when source/flags change.  Bump v3 or flags.mk hash when the
        # toolchain / global compile flags change.
        key: ccache-${{ steps.os.outputs.distro }}-${{ inputs.build-mode }}-v3-${{ hashFiles('production/make/flags.mk', 'production/make/env.mk') }}
        restore-keys: |
          ccache-${{ steps.os.outputs.distro }}-${{ inputs.build-mode }}-v3-
          ccache-${{ steps.os.outputs.distro }}-${{ inputs.build-mode }}-

    # ────────────────────────────────────────────────────────────
    # Docker (only when caller opts in -- ubuntu-latest only).
    # ────────────────────────────────────────────────────────────
    - name: Set up Docker Buildx
      if: inputs.install-docker == 'true' && steps.os.outputs.family == 'ubuntu'
      uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3.11.1

    - name: Show tool versions
      shell: bash
      run: |
        /usr/bin/gcc --version | head -1
        if command -v go >/dev/null; then go version; fi
        if command -v javac >/dev/null; then javac -version; fi
        python3 --version
        command -v ccache >/dev/null && ccache --version | head -1
        python3 -c 'import yaml, jsonschema; print("PyYAML", yaml.__version__)'
