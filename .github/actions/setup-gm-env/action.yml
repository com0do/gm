name: Set up gm build environment
description: >-
  Install everything gm's Makefile expects on Rocky 9 / Rocky 8 (or
  ubuntu) runner: gcc / g++ / binutils (ar) / make, jq, Python 3.12 +
  PyYAML, ccache, gcovr, lcov, rpmbuild, go (for `example/g1`), and
  shellcheck.  Also provisions ccache with a stable key derived from
  OS + BUILD_MODE so incremental C/C++ builds stay hot across PR
  iterations.

  Runs on both:
    * `container: rockylinux:9` (PR CI / production parity;
      BUILD_ARCH=rhlinux)
    * `container: rockylinux:8` (nightly compat lane)
    * `ubuntu-latest`           (fallback for lint / docs / docker jobs)

  Inputs are all optional -- callers just `uses:` the action and
  the right tools land.

inputs:
  build-mode:
    description: BUILD_MODE (debug / release / coverage) -- used to
                 shape ccache key.  Default 'debug'.
    required: false
    default: 'debug'
  install-docker:
    description: Also install docker client + buildx (ubuntu-latest
                 only).  Set to 'true' for container-build jobs.
    required: false
    default: 'false'
  install-coverage:
    description: Install gcovr + lcov + perl bits for `make coverage`.
                 Default 'false' (only coverage job needs them).
    required: false
    default: 'false'
  install-go:
    description: Install golang toolchain for `example/g1`.  Default
                 'true' since it's cheap.
    required: false
    default: 'true'
  install-java:
    description: Install a JDK (javac + jar + java) for target.java.mk
                 (example/j1, example/j2).  Default 'true' -- the
                 install is cheap, and the C-only lane still needs
                 java for the smoke run of j2.jar in the build job.
    required: false
    default: 'true'

outputs:
  ccache-key:
    description: >-
      Primary actions/cache key for ccache.  Pass to save-gm-cache
      after compile steps in the same job.
    value: ${{ steps.ccache-restore.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    # ────────────────────────────────────────────────────────────
    # Detect OS -- Rocky vs Ubuntu -- so we pick the right pm.
    # ────────────────────────────────────────────────────────────
    - name: Detect OS
      id: os
      shell: bash
      run: |
        if [ -f /etc/rocky-release ] || [ -f /etc/redhat-release ]; then
          echo "family=rhel" >> "$GITHUB_OUTPUT"
          # Cache keys: distinguish Rocky 8 vs 9 (glibc + RPM sets differ).
          . /etc/os-release
          echo "distro=${ID}-${VERSION_ID}" >> "$GITHUB_OUTPUT"
        else
          echo "family=ubuntu" >> "$GITHUB_OUTPUT"
          echo "distro=ubuntu" >> "$GITHUB_OUTPUT"
        fi

    # RHEL / Rocky: dnf cache MUST live under GITHUB_WORKSPACE.
    # Container jobs only persist workspace paths through actions/cache;
    # caching /var/cache/dnf directly never saves across runs.
    - name: Restore dnf cache (RHEL family)
      id: dnf-cache
      if: steps.os.outputs.family == 'rhel'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
      with:
        path: .ci-cache/dnf
        key: dnf-${{ steps.os.outputs.distro }}-v6-${{ inputs.install-coverage }}-${{ inputs.install-go }}-${{ inputs.install-java }}-${{ hashFiles('.github/actions/setup-gm-env/action.yml') }}
        restore-keys: |
          dnf-${{ steps.os.outputs.distro }}-v6-

    - name: Install base toolchain (RHEL family)
      if: steps.os.outputs.family == 'rhel'
      shell: bash
      env:
        DNF_CACHE_HIT: ${{ steps.dnf-cache.outputs.cache-hit }}
      run: |
        set -euo pipefail
        cache_root="${GITHUB_WORKSPACE}/.ci-cache/dnf"
        mkdir -p "${cache_root}/cache" "${cache_root}/lib"
        _dnf_opt() {
          local key="$1" val="$2"
          if grep -q "^${key}=" /etc/dnf/dnf.conf; then
            sed -i "s|^${key}=.*|${key}=${val}|" /etc/dnf/dnf.conf
          else
            echo "${key}=${val}" >> /etc/dnf/dnf.conf
          fi
        }
        _dnf_opt cachedir "${cache_root}/cache"
        _dnf_opt persistdir "${cache_root}/lib"
        _dnf_opt keepcache 1
        echo "dnf actions/cache hit: ${DNF_CACHE_HIT:-unknown}"
        meta_expire=21600
        if [ "${DNF_CACHE_HIT:-}" = "true" ]; then
          meta_expire=604800
        fi
        dnf install -y --setopt=install_weak_deps=False \
            --setopt=keepcache=1 \
            --setopt=metadata_expire="${meta_expire}" \
            epel-release
        dnf install -y --setopt=install_weak_deps=False \
            --setopt=keepcache=1 \
            --setopt=metadata_expire="${meta_expire}" \
            gcc gcc-c++ make binutils \
            jq git which \
            rpm-build rpmdevtools \
            findutils tar gzip \
            expat python3.12 python3.12-pip \
            ccache ShellCheck
        if [ "${{ inputs.install-go }}" = "true" ]; then
          dnf install -y --setopt=install_weak_deps=False \
              --setopt=keepcache=1 golang || true
        fi
        if [ "${{ inputs.install-java }}" = "true" ]; then
          dnf install -y --setopt=install_weak_deps=False \
              --setopt=keepcache=1 java-11-openjdk-devel || true
        fi
        alternatives --install /usr/bin/python3 python3 /usr/bin/python3.12 100
        alternatives --set python3 /usr/bin/python3.12

    - name: Install coverage tools (RHEL family)
      if: steps.os.outputs.family == 'rhel' && inputs.install-coverage == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # Rocky 8: powertools.  Rocky 9: crb (same role, renamed).
        if dnf repolist --all 2>/dev/null | awk '{print $1}' | grep -qx crb; then
          extra_repo=crb
        else
          extra_repo=powertools
        fi
        dnf install -y --enablerepo="${extra_repo}" \
            --setopt=install_weak_deps=False --setopt=keepcache=1 \
            lcov perl-DateTime perl-JSON perl-App-cpanminus || true
        PIP_CACHE_DIR="${GITHUB_WORKSPACE}/.ci-cache/pip" python3 -m pip install gcovr

    # ────────────────────────────────────────────────────────────
    # Ubuntu path (fallback for lint / docker / docs jobs)
    #
    # apt caching via actions/cache -- /var/cache/apt/archives holds
    # every downloaded .deb.  Same key discipline as the dnf branch.
    # Without this the container-build job burns ~25s on `apt-get
    # install docker...` every single run.
    # ────────────────────────────────────────────────────────────
    - name: Restore apt cache (Ubuntu)
      if: steps.os.outputs.family == 'ubuntu'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
      with:
        path: /var/cache/apt/archives
        key: apt-${{ runner.os }}-v1-${{ inputs.install-coverage }}-${{ inputs.install-go }}-${{ inputs.install-java }}-${{ inputs.install-docker }}
        restore-keys: |
          apt-${{ runner.os }}-v1-

    - name: Set up Python 3.12 (Ubuntu)
      if: steps.os.outputs.family == 'ubuntu'
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: production/requirements.txt

    - name: Install base toolchain (Ubuntu)
      if: steps.os.outputs.family == 'ubuntu'
      shell: bash
      run: |
        set -euo pipefail
        # Prevent apt-get from wiping the cache we just restored --
        # DPkg::Post-Invoke's `apt-get clean` fires by default on
        # GH runners because /etc/apt/apt.conf.d/docker-clean is
        # present.  Neuter it for the duration of the job.
        sudo rm -f /etc/apt/apt.conf.d/docker-clean
        echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
            | sudo tee /etc/apt/apt.conf.d/keep-cache >/dev/null
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
            build-essential ccache jq \
            rpm shellcheck git ca-certificates

    - name: Install coverage tools (Ubuntu)
      if: steps.os.outputs.family == 'ubuntu' && inputs.install-coverage == 'true'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get install -y --no-install-recommends lcov
        python3 -m pip install gcovr

    - name: Install Go (Ubuntu)
      if: steps.os.outputs.family == 'ubuntu' && inputs.install-go == 'true'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get install -y --no-install-recommends golang-go

    - name: Install JDK (Ubuntu)
      if: steps.os.outputs.family == 'ubuntu' && inputs.install-java == 'true'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get install -y --no-install-recommends default-jdk-headless

    - name: Restore pip cache (RHEL family)
      if: steps.os.outputs.family == 'rhel'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
      with:
        path: .ci-cache/pip
        key: pip-${{ steps.os.outputs.distro }}-py3.12-${{ hashFiles('production/requirements.txt') }}
        restore-keys: |
          pip-${{ steps.os.outputs.distro }}-py3.12-

    - name: Install gm Python runtime deps
      shell: bash
      run: |
        set -euo pipefail
        export PIP_CACHE_DIR="${GITHUB_WORKSPACE}/.ci-cache/pip"
        mkdir -p "$PIP_CACHE_DIR"
        python3 -m pip install \
            'PyYAML>=6.0,<7' 'jsonschema>=4.19,<5'

    # ccache: flags.mk wraps as `ccache /usr/bin/gcc` via CCACHE_PATH env.
    # Do NOT prepend /usr/lib*/ccache to PATH -- the wrappers need the
    # real compiler on PATH and break bare `gcc` calls in CI scripts.
    - name: Prime ccache
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "${GITHUB_WORKSPACE}/.ci-cache/ccache"
        echo "CCACHE_DIR=${GITHUB_WORKSPACE}/.ci-cache/ccache" >> "$GITHUB_ENV"
        if command -v ccache >/dev/null 2>&1; then
          echo "CCACHE_ENABLE=yes" >> "$GITHUB_ENV"
          echo "CCACHE_PATH=$(command -v ccache)" >> "$GITHUB_ENV"
          ccache -M 2G
        fi

    - name: Restore ccache
      id: ccache-restore
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
      with:
        path: .ci-cache/ccache
        # Stable across commits; ccache invalidates per translation unit
        # when source/flags change.  Bump v3 or flags.mk hash when the
        # toolchain / global compile flags change.
        key: ccache-${{ steps.os.outputs.distro }}-${{ inputs.build-mode }}-v3-${{ hashFiles('production/make/flags.mk', 'production/make/env.mk') }}
        restore-keys: |
          ccache-${{ steps.os.outputs.distro }}-${{ inputs.build-mode }}-v3-
          ccache-${{ steps.os.outputs.distro }}-${{ inputs.build-mode }}-

    # ────────────────────────────────────────────────────────────
    # Docker (only when caller opts in -- ubuntu-latest only).
    # ────────────────────────────────────────────────────────────
    - name: Set up Docker Buildx
      if: inputs.install-docker == 'true' && steps.os.outputs.family == 'ubuntu'
      uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3.11.1

    - name: Show tool versions
      shell: bash
      run: |
        /usr/bin/gcc --version | head -1
        python3 --version
        command -v ccache >/dev/null && ccache --version | head -1
        python3 -c 'import yaml, jsonschema; print("PyYAML", yaml.__version__)'
