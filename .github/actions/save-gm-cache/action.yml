name: Save gm ccache
description: >-
  Persist .ci-cache/ccache after compile steps.  Pairs with
  setup-gm-env (restore only).  Always saves so new object files from
  this run are not dropped when the restore step had an exact key hit.

inputs:
  cache-key:
    description: Primary ccache key from setup-gm-env outputs.ccache-key
    required: true

runs:
  using: composite
  steps:
    - name: ccache statistics
      if: inputs.cache-key != ''
      shell: bash
      run: ccache -s 2>/dev/null || true

    - name: Save ccache
      if: always() && inputs.cache-key != ''
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
      with:
        path: .ci-cache/ccache
        key: ${{ inputs.cache-key }}
