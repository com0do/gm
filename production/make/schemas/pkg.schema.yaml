# SPDX-License-Identifier: MIT
#
# pkg.schema.yaml -- canonical pkg-config schema (JSON Schema 2020-12,
# authored as YAML for readability).
#
# Describes the shape of a gm package as `pkg-build.py` consumes it.
# Every deployment fact that shows up in the generated .spec / manifest
# / component.h / alarm code lives in this document or comes from a
# field's `default:` here -- nothing else in the tree overrides it.
#
# Two kinds of fields:
#   * required   -- user MUST provide.  Missing -> hard schema error
#                    with a pointer to this file's line.
#   * default    -- user MAY omit.  Missing -> filled from the value
#                    below.  Encoding conventions in the schema
#                    (instead of Python constants) is the whole point
#                    of a declarative schema: contributors read this
#                    file to learn what a minimal pkg-config looks
#                    like, and code changes become schema edits.
#
# Editor integration
# ------------------
# VS Code / IntelliJ / vim (YAML Language Server) all resolve
# `# yaml-language-server: $schema=...` file-header directives, so
# users writing pkg-config YAML get autocomplete + inline validation
# from this same schema.
#
# Runtime consumer: pkg-build.py extends jsonschema.Draft202012Validator
# with a defaults-filler and validates every pkg-config against this
# schema before emitting manifest.json / .spec / component.h / alarms.

$schema: https://json-schema.org/draft/2020-12/schema
$id:     https://gm.local/schemas/pkg.schema.yaml
title:   gm package configuration
type:    object
additionalProperties: false

# --- required fields ---------------------------------------------------
#
# `pkg` names the RPM.  `files` guarantees the package actually carries
# a payload -- an empty package would still install cleanly but is
# essentially never the author's intent, so we force at least one entry
# and fail loudly when a config accidentally drops the list.
required: [pkg, files]

# --- property definitions ---------------------------------------------
properties:

  pkg:
    type:        string
    description: RPM package name.
    pattern:     '^[A-Za-z0-9._+-]+$'

  description:
    type:        string
    description: Human-readable summary; ends up as the RPM Summary line.
    default:     ''

  pkg_type:
    type:        string
    description: RPM shape (whole product vs. patch vs. sublibrary).
    enum:        [full_product, patch, sublibrary]
    default:     full_product

  major:
    type:        string
    description: Package major version (string, not int, so leading zeros survive).
    pattern:     '^[0-9]+$'
    default:     '1'

  minor:
    type:        string
    description: Package minor version.
    pattern:     '^[0-9]+$'
    default:     '0'

  rpm_deps:
    type:        array
    description: RPM-level `Requires:` entries.
    items:       {type: string}
    default:     []

  install_root:
    type:        string
    description: Install prefix baked into the generated .spec's %install section.
    pattern:     '^/'
    default:     /opt/gm

  # -------------------------------------------------------------------
  # Filegroup -> install-location map.
  #
  # `files[]` entries name a filegroup (a logical label -- "Binaries64",
  # "Config_OS", ...); this map turns each label into a concrete install
  # directory + default mode/owner/group.  Users override individual
  # entries via `--filegroup-map <json>` (shallow-merge, per key).
  # Adding a new filegroup convention is a schema edit -- one place,
  # one source of truth.
  # -------------------------------------------------------------------
  filegroup_map:
    type:        object
    description: filegroup-name -> {dir, mode, owner, group} lookup.
    additionalProperties:
      type: object
      required: [dir, mode, owner, group]
      additionalProperties: false
      properties:
        dir:   {type: string,  description: 'Install subdir under install_root.'}
        mode:  {type: string,  pattern: '^[0-7]{3,4}$'}
        owner: {type: string}
        group: {type: string}
    default:
      Binaries:                       {dir: bin,          mode: '0555', owner: bin,  group: bin}
      Binaries64:                     {dir: bin,          mode: '0555', owner: bin,  group: bin}
      Libraries:                      {dir: lib,          mode: '0555', owner: bin,  group: bin}
      Impl_Libraries64:               {dir: lib,          mode: '0555', owner: bin,  group: bin}
      Jar_Files:                      {dir: lib/java,     mode: '0444', owner: bin,  group: bin}
      Config_OS:                      {dir: config,       mode: '0555', owner: root, group: root}
      ActionScript_for_Global:        {dir: scripts,      mode: '0755', owner: root, group: root}
      Install_Tools:                  {dir: tools,        mode: '0755', owner: root, group: root}
      Script_Unit:                    {dir: scripts/unit, mode: '0755', owner: root, group: root}
      SMU_Unblock_Interfaces_Plugins: {dir: plugins,      mode: '0555', owner: bin,  group: bin}
      AF_Descriptors:                 {dir: descriptors,  mode: '0444', owner: bin,  group: bin}

  filegroup_fallback:
    type:        object
    description: |
      Used when a `files[].filegroup` doesn't match any key in
      filegroup_map -- everything drops into a `misc` subdir rather
      than the build erroring out.  Set `filegroup_fallback: {}` (or
      just remove all keys) via the override JSON to make unknown
      filegroups fatal instead.
    required: [dir, mode, owner, group]
    additionalProperties: false
    properties:
      dir:   {type: string}
      mode:  {type: string, pattern: '^[0-7]{3,4}$'}
      owner: {type: string}
      group: {type: string}
    default: {dir: misc, mode: '0555', owner: bin, group: bin}

  # -------------------------------------------------------------------
  # component: identity of the (single) component this pkg carries.
  # Compiled into consumer libs as `#define <PREFIX>_NAME "..."` etc.
  # via pkg-build.py --header-out.  Empty by
  # default -- pkgs that are pure config / data don't need a component.
  # -------------------------------------------------------------------
  component:
    type:                 object
    description:          "Component identity block.  Empty -> no component.h emitted."
    additionalProperties: false
    default:              {}
    properties:
      name:          {type: string, default: '', description: 'Display name (goes into <PREFIX>_NAME).'}
      id:            {type: string, default: '', description: 'Unique component id (dotted decimal is conventional).'}
      major_version: {type: string, pattern: '^[0-9]+$', default: '1'}
      minor_version: {type: string, pattern: '^[0-9]+$', default: '0'}
      comp_type:     {type: string, default: '', description: 'e.g. application, library, tool.'}

  # -------------------------------------------------------------------
  # files: the pkg's physical payload.  Grouped by filegroup name, so
  # the 90 % common case (many files sharing Binaries64 / Config_OS /
  # ...) is a plain list of src paths.  Per-file override is available
  # via the long form (see below).
  #
  #     files:
  #       Binaries64:
  #         - $GM_EXEC_DIR/foo
  #         - $GM_EXEC_DIR/bar
  #       Config_OS:
  #         - $PROJ_TOP/etc/foo.conf
  #         - src:   $PROJ_TOP/etc/post-install.sh
  #           mode:  '0755'
  #           owner: root
  #           group: root
  #
  # Each filegroup's value is a non-empty array.  Each element is
  # either:
  #   * a string -- src path only; mode/owner/group come from
  #                 filegroup_map[<filegroup>]
  #   * an object -- {src, mode?, owner?, group?}; declared fields
  #                  override the filegroup default for that one entry
  # `filegroup` is implicit from the parent key -- never repeat it
  # inside the object form.
  # -------------------------------------------------------------------
  files:
    type:          object
    description:   filegroup-name -> list of file entries (short or long form).
    minProperties: 1
    additionalProperties:
      type:     array
      minItems: 1
      items:
        oneOf:
          - type:        string
            description: 'src path; inherits filegroup defaults.'
          - type:                 object
            required:             [src]
            additionalProperties: false
            properties:
              src:
                type:        string
                description: |
                  Source path (may contain $VAR references resolved via
                  --vars).  Basename becomes the installed filename.
              mode:
                type:    string
                pattern: '^[0-7]{3,4}$'
                description: 'Per-file mode override.'
              owner: {type: string, description: 'Per-file owner override.'}
              group: {type: string, description: 'Per-file group override.'}

  # -------------------------------------------------------------------
  # alarms: enum table shipped as an autogenerated C++ library.
  # pkg-build.py's `--alarms-out` renders one `alarms.h` + `alarms.cxx`
  # pair from this list.  Empty list -> empty-table stub, still safe.
  # -------------------------------------------------------------------
  alarms:
    type:        array
    description: Alarm table stub (empty is safe -- emitter writes a zero-entry table).
    default:     []
    items:
      type: object
      required: [name, number]
      additionalProperties: false
      properties:
        name:
          type:    string
          pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
          description: 'C++ identifier for the alarm (turned into `kName` in the enum).'
        number:
          type:    string
          pattern: '^[0-9]+$'
          description: 'Numeric AlarmNumber; unique per pkg is conventional.'
        alarm_type:
          type:    string
          enum:    [PROCESSING, COMMUNICATION, EQUIPMENT, ENVIRONMENTAL, QUALITY_OF_SERVICE, '']
          default: ''
        severity:
          type:    string
          enum:    [INDETERMINATE, CRITICAL, MAJOR, MINOR, WARNING, CLEARED, '']
          default: ''
        suppression_time: {type: string, pattern: '^[0-9]*$', default: '0'}
        corr_specifier:   {type: string, pattern: '^[0-9]*$', default: '0'}
        short_text:       {type: string, default: ''}
        long_text:        {type: string, default: ''}
        repair_text:      {type: string, default: ''}
