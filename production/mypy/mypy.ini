# production/mypy/mypy.ini -- mypy configuration for gm's Python
# helper scripts.
#
# Native mypy INI format.  Chosen over TOML (`[tool.mypy]` in
# pyproject.toml) so the file's identity says "mypy config" and
# nothing more -- no PEP 621 packaging semantics attached.
#
# Every mypy invocation passes `--config-file production/mypy/mypy.ini`
# explicitly.  Local: `production/tools/precheck.sh`.  CI:
# `.github/workflows/ci.yml`'s lint-python job.  Editor integrations
# should point at the same path.
#
# The config is deliberately lax -- gm's Python is helper-tier, not
# a shipping library.  We accept dynamic typing everywhere and only
# run mypy to catch outright silliness (bad attribute access, wrong
# type of arg, etc.).  Tightening this is on the P1 todo list.

[mypy]
# python_version is the runtime we PROMISE to work on.  Helper
# scripts use PEP 585 built-in generics (`list[str]`, 3.9+), PEP 604
# unions (`X | None`, 3.10+), and PEP 695 `type` statements (3.12+),
# so 3.12 is the floor.  3.12 is also the current mainstream release.
python_version         = 3.12
ignore_missing_imports = True
allow_untyped_defs     = True
warn_return_any        = False
warn_unused_ignores    = False

# `exclude` accepts a regex in the INI form -- one per line joined by
# `|`.  We drop generated / vendored trees so mypy doesn't spend time
# on code we don't own.
exclude = (?x)(
      ^build/
    | ^production/tools/gtest-1\.14\.0/
    | ^container/examples/
    | ^example/
    )
