# cmproxy template for pkg-tmd.
#
# Loaded by the `cmproxy` sidecar in every container that hosts a
# pkg-tmd process.  cmproxy uses it to answer tmd's config queries
# against the central `generic.yaml`.
#
# Anatomy:
#   - `pkg` identifies which pkg this template serves.
#   - `schema` points at the yang module that defines the query
#     namespace (relative to customization/ root).
#   - `map` is the query-to-generic-path mapping.  A pkg process
#     calls `gm_cmproxy_get(h, "<query>")` and cmproxy resolves the
#     corresponding path in generic.yaml.
#   - `access` is a coarse-grained read/write policy.  In this demo
#     everything is read-only; a real deployment might allow
#     operator-tools to POST changes to specific subtrees.

pkg:     pkg-tmd
schema:  yang/pkg-tmd/pkg-tmd.yang

# Where in generic.yaml the pkg's own tree lives.  cmproxy walks from
# here for every query -- so `gm_cmproxy_get(h, "window")` on
# tmd's side turns into `generic.yaml`'s `pkg-tmd.config.window`.
mount:   pkg-tmd/config

# Optional: query aliases.  Lets code use short, stable names even if
# the underlying generic.yaml layout shifts.
aliases:
  # short-name          →  path (relative to mount)
  WINDOW:                 "window"
  REPORT_EVERY:           "report-every"
  THRESHOLDS:             "threshold"
  LOG_LEVEL:              "log-level"

access:
  # A `deny` list wins over the (implicit) allow-all read.  pkg-tmd is
  # never allowed to see other pkgs' trees, only its own mount.
  read:  [pkg-tmd/config]
  write: []              # runtime writes not allowed for this template
